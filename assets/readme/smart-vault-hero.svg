<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="smart-vault — 8b.is-crew Pure-Rust #![no_std] + ASM + CSR Sovereign Memory Stack">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090F"/>
      <stop offset="50%" stop-color="#0C101B"/>
      <stop offset="100%" stop-color="#080A12"/>
    </linearGradient>
    <linearGradient id="obsidianGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6366F1"/>
