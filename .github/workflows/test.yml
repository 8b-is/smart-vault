name: Hermetic verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-ci:
    name: ${{ matrix.os }} / Rust stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Verify #![no_std] core
        run: cargo check -p smart-vault-core --no-default-features

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -D dead_code -D unused_imports

      - name: Run unit and integration tests
        run: cargo test --workspace

      - name: Validate contracts and package metadata
        run: |
          cargo run --quiet -- contracts --repo-root .
          cargo run --quiet -- package validate --repo-root .

      - name: Build release binary
        run: cargo build --release
