[workspace]
members = [".", "crates/smart-vault-core"]
resolver = "2"

[package]
name = "smart-vault"
version = "4.2.0"
edition = "2021"
rust-version = "1.75"
authors = ["8b.is-crew <crew@8b.is>"]
description = "Agent-agnostic, pure-Rust #![no_std]+ASM+CSR Obsidian second brain wired into 8b-is/smart-tree, MemNet, and MemPalace"
license = "MIT"
repository = "https://github.com/peterlodri-sec/claude-obsidian"
readme = "README.md"
keywords = ["obsidian", "knowledge-graph", "bm25", "smart-tree", "memnet"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "smart_vault"
path = "src/lib.rs"

[[bin]]
name = "smart-vault"
path = "src/main.rs"

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
hex = "0.4"
memchr = "2.7"
mimalloc = { version = "0.1", default-features = false, optional = true }
rayon = "1.10"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
smart-vault-core = { path = "crates/smart-vault-core" }
thiserror = "2.0"
unicode-normalization = "0.1"
walkdir = "2.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.14"

[[bench]]
name = "vault_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
