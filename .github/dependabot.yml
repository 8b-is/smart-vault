# smart-vault uses pure Rust crates (Cargo.toml / Cargo.lock) and SHA-pinned GitHub Actions.
# Dependabot proposes reviewed updates for both ecosystems cleanly.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore(ci)
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore(deps)
